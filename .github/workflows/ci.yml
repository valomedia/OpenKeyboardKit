name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: valomedia/github-workflows/.github/workflows/ios-ci.yml@0e24ac0bdeb710a9d37ff088d95fe8789a8d4516 # v1.2.1
    with:
      runs-on: macos-15
      xcode-path: /Applications/Xcode_16.4.app
      install-command: ''
      # Unused for this Swift package's custom build and test commands.
      workspace: ''
      scheme: OpenKeyboardKit
      lint-command: swift package plugin --allow-writing-to-package-directory swiftlint --strict
      build-command: bash scripts/build.sh OpenKeyboardKit
      unit-test-command: bash scripts/test.sh OpenKeyboardKit iOS
